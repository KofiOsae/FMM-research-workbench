name: Physics and regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run physics and regression tests
        run: python -m unittest test_validation.py
      - name: Smoke-test server
        run: |
          HOST=127.0.0.1 PORT=8765 PUBLIC_DEMO=1 python app.py &
          server_pid=$!
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/health && break
            sleep 1
          done
          curl --fail http://127.0.0.1:8765/health
          kill "$server_pid"
