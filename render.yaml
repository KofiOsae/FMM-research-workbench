services:
  - type: web
    name: fmm-research-workbench
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: PUBLIC_DEMO
        value: "1"
      - key: FINITE_GRID_LIMIT_PUBLIC
        value: "80000"
      - key: FMM_USER_MATERIALS_PATH
        value: /tmp/fmm-user-materials.json
      - key: USAGE_STATS_PATH
        value: /tmp/fmm-usage-stats.json
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
    autoDeploy: true
