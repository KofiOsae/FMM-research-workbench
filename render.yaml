services:
  - type: web
    name: fmm-research-workbench
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: PUBLIC_DEMO
        value: "1"
      - key: FMM_USER_MATERIALS_PATH
        value: /tmp/fmm-user-materials.json
    autoDeploy: true
